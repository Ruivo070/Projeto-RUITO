<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>KanbanFlow — Tarefa</title>
  <link rel="stylesheet" href="/board.css">
  <link rel="stylesheet" href="/task.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <rect x="3.5" y="4" width="7" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="13.5" y="4" width="7" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
      KanbanFlow
    </div>
    <div class="topbar-actions">
      <a class="secondary-button" id="back-to-board" href="/boards.html">Voltar ao quadro</a>
      <span class="role-badge" id="task-role" hidden></span>
      <button class="logout-button" id="logout-button" type="button" aria-label="Sair da conta">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10 17l5-5-5-5m5 5H3m9-8h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sair
      </button>
    </div>
  </header>
  <main>
    <section class="task-page" id="task-content" hidden>
      <div class="page-heading task-heading">
        <div>
          <p class="eyebrow">Detalhes da tarefa</p>
          <h1 id="page-title">Carregando tarefa...</h1>
          <p class="subtitle" id="board-name"></p>
        </div>
        <button class="primary-button" id="save-task" type="button">Salvar alterações</button>
      </div>
      <p class="task-feedback" id="task-feedback" role="status" aria-live="polite"></p>

      <section class="task-panel" aria-label="Detalhes">
        <div class="task-fields">
          <label class="field">
            <span>Título</span>
            <input id="task-title" type="text" maxlength="100">
          </label>
          <label class="field">
            <span>Descrição</span>
            <textarea id="task-description" maxlength="500" rows="5"></textarea>
          </label>
          <div class="field-grid">
            <label class="field">
              <span>Status</span>
              <select id="task-status">
                <option value="todo">A Fazer</option>
                <option value="doing">Em Andamento</option>
                <option value="done">Concluído</option>
              </select>
            </label>
            <label class="field">
              <span>Responsável</span>
              <select id="task-assignee">
                <option value="">Sem responsável</option>
              </select>
            </label>
            <label class="field">
              <span>Prazo</span>
              <input id="task-due-date" type="date">
            </label>
            <label class="field">
              <span>Prioridade</span>
              <select id="task-priority">
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span>Labels <small>(separadas por vírgula)</small></span>
            <input id="task-labels" type="text" maxlength="500" placeholder="bug, feature, urgente">
          </label>
          <p class="created-note" id="created-note"></p>
        </div>
      </section>

      <div class="task-lower-grid">
        <section class="task-panel" aria-labelledby="checklist-heading">
          <div class="section-heading">
            <div>
              <h2 id="checklist-heading">Checklist</h2>
              <p id="checklist-progress">0/0 concluídas</p>
            </div>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Progresso da checklist" aria-valuemin="0" aria-valuemax="100">
            <span id="progress-bar"></span>
          </div>
          <ul class="checklist" id="checklist"></ul>
          <form class="inline-form" id="checklist-form">
            <label class="visually-hidden" for="checklist-text">Nova subtarefa</label>
            <input id="checklist-text" type="text" maxlength="200" placeholder="Adicionar subtarefa">
            <button class="secondary-button" type="submit">Adicionar</button>
          </form>
        </section>

        <section class="task-panel" aria-labelledby="comments-heading">
          <div class="section-heading">
            <div>
              <h2 id="comments-heading">Comentários</h2>
              <p>Conversa sobre esta tarefa</p>
            </div>
          </div>
          <ul class="comments-list" id="comments-list"></ul>
          <form class="comment-form" id="comment-form">
            <label class="visually-hidden" for="comment-text">Novo comentário</label>
            <textarea id="comment-text" maxlength="1000" rows="3" placeholder="Escreva um comentário..."></textarea>
            <button class="primary-button" type="submit">Comentar</button>
          </form>
        </section>
      </div>
    </section>

    <section class="access-state" id="access-state" hidden aria-live="polite">
      <p class="eyebrow">Acesso restrito</p>
      <h1>Sem permissão</h1>
      <p>Você não tem acesso a esta tarefa ou ela não existe.</p>
      <a class="secondary-button" href="/boards.html">Voltar aos quadros</a>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/task.js" defer></script>
</body>
</html>
